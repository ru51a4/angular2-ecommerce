<div class="header mt-4 row d-flex">
    <div class="col-6">
        <span>{{(service.catalog)['tree']?.[1]?.key | async}}</span>
    </div>
    <div *ngIf="0" class="col-6 d-flex justify-content-end">
        <button class="btn">
            Хиты продаж
        </button>
        <button class="btn">
            Для города
        </button>
        <button class="btn">
            Для взрослых
        </button>
        <button class="btn">
            Для детей
        </button>
    </div>
</div>
<div class="mt-5 d-flex justify-content-center flex-column align-items-center catalog">
    <ng-container *ngIf="!(service.init | async)">
        <div class="spinner-border" role="status">
        </div>
    </ng-container>
    <div class="d-flex flex-wrap align-items-center justify-content-center d-lg-none">
        <ng-container *ngFor="let item of service.els | async; let i = index">
            <app-item-card *ngIf="i >= 0 && i < 8" class="col-6 mt-2" [data]="item"></app-item-card>
        </ng-container>
    </div>

    <div class="d-none d-lg-block">
        <div class="d-flex flex-wrap">
            <ng-container *ngFor="let item of service.els | async; let i = index">
                <app-item-card *ngIf="i < 4" [data]="item"></app-item-card>
            </ng-container>
        </div>
        <div class="d-flex mt-4 flex-wrap">
            <ng-container *ngFor="let item of service.els | async; let i = index">
                <app-item-card *ngIf="i >= 4 && i < 8" [data]="item"></app-item-card>
            </ng-container>
        </div>
    </div>

</div>
